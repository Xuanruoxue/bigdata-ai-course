<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 432" width="100%" role="img" aria-labelledby="wvaT wvaD">
<title id="wvaT">Workflow 与 Agent 的路径差异</title>
<desc id="wvaD">Workflow 的步骤预先写死在代码里，路径是直的；Agent 的下一步由模型运行时决定，路径会随反馈来回调整。</desc>
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8e8b82" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<g font-family="Inter, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">

<text x="40" y="64" font-size="14" font-weight="500" fill="#3d3d3a">Workflow · 工作流</text>
<text x="40" y="82" font-size="11" fill="#8e8b82">路径预先写死在代码里</text>
<text x="364" y="64" font-size="14" font-weight="500" fill="#8f4430">Agent · 智能体</text>
<text x="364" y="82" font-size="11" fill="#8e8b82">下一步由模型运行时决定</text>

<rect x="40" y="100" width="276" height="44" rx="9" fill="#efe9de" stroke="#d8cdba" stroke-width="0.5"/>
<text x="56" y="127" font-size="13" fill="#3d3d3a">步骤 1 · 取数</text>
<rect x="40" y="162" width="276" height="44" rx="9" fill="#efe9de" stroke="#d8cdba" stroke-width="0.5"/>
<text x="56" y="189" font-size="13" fill="#3d3d3a">步骤 2 · 计算</text>
<rect x="40" y="224" width="276" height="44" rx="9" fill="#efe9de" stroke="#d8cdba" stroke-width="0.5"/>
<text x="56" y="251" font-size="13" fill="#3d3d3a">步骤 3 · 出图</text>
<rect x="40" y="286" width="276" height="44" rx="9" fill="#e8e0d2" stroke="#d8cdba" stroke-width="0.5"/>
<text x="56" y="313" font-size="13" font-weight="500" fill="#141413">产物：每次都一样</text>
<path d="M178 144 L178 158" stroke="#8e8b82" stroke-width="1.5" fill="none" marker-end="url(#ag)"/>
<path d="M178 206 L178 220" stroke="#8e8b82" stroke-width="1.5" fill="none" marker-end="url(#ag)"/>
<path d="M178 268 L178 282" stroke="#8e8b82" stroke-width="1.5" fill="none" marker-end="url(#ag)"/>

<rect x="364" y="100" width="276" height="44" rx="9" fill="#f9e7df" stroke="#cc785c" stroke-width="0.5"/>
<text x="380" y="127" font-size="13" fill="#8f4430">拿到目标</text>
<rect x="364" y="162" width="276" height="44" rx="9" fill="#f3d3c6" stroke="#cc785c" stroke-width="0.5"/>
<text x="380" y="189" font-size="13" fill="#8f4430">LLM 决定下一步</text>
<rect x="364" y="224" width="276" height="44" rx="9" fill="#f9e7df" stroke="#cc785c" stroke-width="0.5"/>
<text x="380" y="251" font-size="13" fill="#8f4430">调工具 → 看结果</text>
<rect x="364" y="286" width="276" height="44" rx="9" fill="#efe9de" stroke="#d8cdba" stroke-width="0.5"/>
<text x="380" y="313" font-size="13" font-weight="500" fill="#141413">交付：可能每次不同</text>
<path d="M502 144 L502 158" stroke="#8e8b82" stroke-width="1.5" fill="none" marker-end="url(#ag)"/>
<path d="M502 206 L502 220" stroke="#8e8b82" stroke-width="1.5" fill="none" marker-end="url(#ag)"/>
<path d="M502 268 L502 282" stroke="#8e8b82" stroke-width="1.5" fill="none" marker-end="url(#ag)"/>

<path d="M364 246 H348 Q340 246 340 238 V192 Q340 184 348 184 H364" fill="none" stroke="#cc785c" stroke-width="1.5" marker-end="url(#ag)"/>

<text x="40" y="350" font-size="11" fill="#8e8b82">省钱 · 好测 · 结果可复现</text>
<text x="364" y="350" font-size="11" fill="#8e8b82">↺ 每步都能回头修正，但更贵也更难预测</text>

<rect x="40" y="364" width="600" height="48" rx="10" fill="#181715"/>
<text x="60" y="386" font-size="13" font-weight="500" fill="#faf9f5">判断标准只有一条：控制权在代码，还是在模型？</text>
<text x="60" y="404" font-size="11" fill="#a09d96">能用 Workflow 解决的，就别上 Agent —— 更便宜、更稳、更好测</text>
</g>
</svg>
