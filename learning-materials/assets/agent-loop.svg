<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 414" width="100%" role="img" aria-labelledby="loopT loopD">
<title id="loopT">ReAct 智能体循环</title>
<desc id="loopD">拿到目标后，Agent 反复执行思考、行动、观察三步，把真实反馈喂回大脑，直到完成或触发护栏上限。</desc>
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8e8b82" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<g font-family="Inter, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
<rect x="100" y="40" width="380" height="52" rx="10" fill="#e8e0d2" stroke="#d8cdba" stroke-width="0.5"/>
<text x="116" y="64" font-size="14" font-weight="500" fill="#141413">拿到目标</text>
<text x="116" y="82" font-size="11" fill="#6c6a64">例如：分析订单表，找出 7 月销量最高的 SKU</text>

<path d="M290 92 L290 106" stroke="#8e8b82" stroke-width="1.5" fill="none" marker-end="url(#ag)"/>

<rect x="100" y="108" width="380" height="62" rx="10" fill="#f9e7df" stroke="#cc785c" stroke-width="0.5"/>
<text x="112" y="136" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#cc785c">A</text>
<text x="136" y="134" font-size="14" font-weight="500" fill="#8f4430">思考 Reason</text>
<text x="136" y="154" font-size="11" fill="#8f4430">判断下一步调哪个工具，还是已经可以直接回答</text>

<path d="M290 170 L290 184" stroke="#8e8b82" stroke-width="1.5" fill="none" marker-end="url(#ag)"/>

<rect x="100" y="186" width="380" height="62" rx="10" fill="#e3f2ee" stroke="#5db8a6" stroke-width="0.5"/>
<text x="112" y="214" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#5db8a6">B</text>
<text x="136" y="212" font-size="14" font-weight="500" fill="#2c6b5e">行动 Act</text>
<text x="136" y="232" font-size="11" fill="#2c6b5e">系统真的去执行：查数据库 · 发请求 · 跑代码</text>

<path d="M290 248 L290 262" stroke="#8e8b82" stroke-width="1.5" fill="none" marker-end="url(#ag)"/>

<rect x="100" y="264" width="380" height="62" rx="10" fill="#fbeeda" stroke="#e8a55a" stroke-width="0.5"/>
<text x="112" y="292" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#e8a55a">C</text>
<text x="136" y="290" font-size="14" font-weight="500" fill="#8a5a17">观察 Observe</text>
<text x="136" y="310" font-size="11" fill="#8a5a17">把工具返回的真实结果喂回大脑，评估进度</text>

<path d="M290 326 L290 340" stroke="#8e8b82" stroke-width="1.5" fill="none" marker-end="url(#ag)"/>

<rect x="100" y="342" width="380" height="52" rx="10" fill="#efe9de" stroke="#d8cdba" stroke-width="0.5"/>
<text x="116" y="366" font-size="14" font-weight="500" fill="#141413">交付结果</text>
<text x="116" y="384" font-size="11" fill="#6c6a64">或触发护栏上限：步数 / 超时 / 预算</text>

<path d="M480 295 H560 Q580 295 580 275 V159 Q580 139 560 139 H480" fill="none" stroke="#8e8b82" stroke-width="1.5" marker-end="url(#ag)"/>
<rect x="546" y="196" width="68" height="52" rx="8" fill="#faf9f5" stroke="#cc785c" stroke-width="0.5"/>
<text x="580" y="218" font-size="12" fill="#8f4430" text-anchor="middle">循环</text>
<text x="580" y="238" font-size="12" fill="#8f4430" text-anchor="middle">回 A</text>
</g>
</svg>
