<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 388" width="100%" role="img" aria-labelledby="cmT cmD">
<title id="cmT">Agent、上下文与 Skill 的咬合关系</title>
<desc id="cmD">Agent 是执行者，负责读写上下文并决定装配什么；上下文是工作台，决定 Agent 能想到多好；Skill 是知识包，按 description 被激活后把正文读入上下文，任务完成后新经验又可写回。</desc>
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8e8b82" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<g font-family="Inter, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">

<rect x="40" y="110" width="170" height="116" rx="12" fill="#f9e7df" stroke="#cc785c" stroke-width="0.5"/>
<text x="54" y="142" font-size="15" font-weight="500" fill="#8f4430">Agent</text>
<text x="54" y="164" font-size="11" fill="#8f4430">LLM 决策循环</text>
<text x="54" y="182" font-size="11" fill="#8f4430">自己决定下一步</text>
<text x="54" y="200" font-size="11" fill="#8f4430">拆任务 · 调工具</text>

<rect x="250" y="88" width="180" height="160" rx="12" fill="#f5f0e8" stroke="#d8cdba" stroke-width="0.5"/>
<text x="266" y="118" font-size="15" font-weight="500" fill="#141413">上下文</text>
<text x="266" y="138" font-size="11" fill="#6c6a64">本次能依据的一切</text>
<text x="266" y="160" font-size="11" fill="#6c6a64">系统提示 · 历史</text>
<text x="266" y="178" font-size="11" fill="#6c6a64">检索资料 · 工具结果</text>
<line x1="266" y1="192" x2="414" y2="192" stroke="#e6dfd8" stroke-width="0.5"/>
<text x="266" y="212" font-size="11" fill="#8f4430">= 动态工作台</text>
<text x="266" y="230" font-size="11" fill="#8f4430">装什么，Agent 说了算</text>

<rect x="470" y="110" width="170" height="116" rx="12" fill="#e3f2ee" stroke="#5db8a6" stroke-width="0.5"/>
<text x="484" y="142" font-size="15" font-weight="500" fill="#2c6b5e">Skill</text>
<text x="484" y="164" font-size="11" fill="#2c6b5e">可复用的做法</text>
<text x="484" y="182" font-size="11" fill="#2c6b5e">SKILL.md + 资源</text>
<text x="484" y="200" font-size="11" fill="#2c6b5e">按需加载，不常驻</text>

<path d="M210 140 L246 140" fill="none" stroke="#8e8b82" stroke-width="1.5" marker-end="url(#ag)"/>
<text x="230" y="132" font-size="11" fill="#6c6a64" text-anchor="middle">写入</text>
<path d="M250 190 L214 190" fill="none" stroke="#8e8b82" stroke-width="1.5" marker-end="url(#ag)"/>
<text x="230" y="182" font-size="11" fill="#6c6a64" text-anchor="middle">读取</text>
<path d="M470 150 L434 150" fill="none" stroke="#8e8b82" stroke-width="1.5" marker-end="url(#ag)"/>
<text x="452" y="142" font-size="11" fill="#6c6a64" text-anchor="middle">读入</text>

<path d="M125 226 V296 Q125 312 141 312 H539 Q555 312 555 296 V226" fill="none" stroke="#cc785c" stroke-width="1.5" marker-end="url(#ag)"/>
<text x="340" y="336" font-size="12" fill="#6c6a64" text-anchor="middle">按 description 激活 · 完成后的新经验写回</text>

<text x="340" y="368" font-size="12" fill="#8e8b82" text-anchor="middle">Agent 是执行者 · 上下文是工作台 · Skill 是知识包</text>
</g>
</svg>
